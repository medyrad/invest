[project]
name = "invest-backend"
version = "0.1.0"
description = "invest modular backend"
requires-python = ">=3.14.10,<3.15"
dependencies = [
  "django==5.2.19",
  "djangorestframework==3.18.3",
  "psycopg[binary]==3.3.9",
  "gunicorn==27.0.1",
  "pillow==13.0.0",
  "pypdf==7.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "ruff==0.17.5",
  "openapi-spec-validator==0.9.0",
  "jsonschema==4.26.0",
]

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
cache_dir = "/tmp/invest-pytest-cache"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["apps/identity/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
