name: invest
services:
  db:
    image: public.ecr.aws/docker/library/postgres:17.12-alpine@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2
    env_file: ../.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: runtime
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BACKEND_INTERNAL_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3108}:3000"
    depends_on:
      backend: {condition: service_healthy}
  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: test
    env_file: ../.env
    environment:
      INVEST_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
    command: ["/app/.venv/bin/pytest", "-q"]
  browser-api:
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: test
    env_file: ../.env
    environment:
      INVEST_ENV: test
      DJANGO_SETTINGS_MODULE: tests.browser_settings
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_browser
    ports: ["127.0.0.1:8008:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
