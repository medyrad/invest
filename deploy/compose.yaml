name: invest
services:
  db:
    image: public.ecr.aws/docker/library/postgres:17.12-alpine@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2
    env_file: ../.env
    environment:
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: runtime
      args:
        INVEST_SOURCE_COMMIT: ${INVEST_SOURCE_COMMIT:-unknown}
        INVEST_SOURCE_TREE: ${INVEST_SOURCE_TREE:-unknown}
        INVEST_BACKEND_SOURCE_SHA256: ${INVEST_BACKEND_SOURCE_SHA256:-unknown}
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    volumes:
      - type: bind
        source: ${OPENAI_API_KEY_FILE_HOST:-/dev/null}
        target: /run/secrets/openai_api_key
        read_only: true
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BACKEND_INTERNAL_ORIGIN: http://backend:8000
        INVEST_SOURCE_COMMIT: ${INVEST_SOURCE_COMMIT:-unknown}
        INVEST_SOURCE_TREE: ${INVEST_SOURCE_TREE:-unknown}
        INVEST_FRONTEND_SOURCE_SHA256: ${INVEST_FRONTEND_SOURCE_SHA256:-unknown}
    ports:
      - "127.0.0.1:${WEB_PORT:-3108}:3000"
    depends_on:
      backend: {condition: service_healthy}
  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: test
    env_file: ../.env
    environment:
      INVEST_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
    depends_on:
      db: {condition: service_healthy}
    command: ["/app/.venv/bin/pytest", "-q"]
  browser-api:
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: test
    env_file: ../.env
    environment:
      INVEST_ENV: test
      DJANGO_SETTINGS_MODULE: tests.browser_settings
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_browser
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
    ports: ["127.0.0.1:8008:8000"]
    depends_on:
      db: {condition: service_healthy}
  scanner:
    image: invest-scanner:1.5.4
    command: ["--config-file=/etc/clamd.conf"]
    volumes:
      - ../deploy/clamd.conf:/etc/clamd.conf:ro
      - ../.tools/scanner/data:/var/lib/clamav:ro
    read_only: true
    tmpfs: [/tmp:size=256m]
    mem_limit: 4g
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',3310),3); s.sendall(b'zPING'+bytes([0])); assert s.recv(16).startswith(b'PONG')"]
      interval: 10s
      timeout: 4s
      retries: 20
  workspace-jobs:
    image: invest-backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: ""
    command: [/app/.venv/bin/python, manage.py, workspace_jobs]
    depends_on:
      backend: {condition: service_healthy}
      scanner: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 64

volumes:
  pgdata:
