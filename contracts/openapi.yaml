  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "message",
              "fields",
              "request_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "fields": {
                "type": "object"
              },
              "request_id": {
                "type": "string",
                "format": "uuid"
              }
            }
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable"
            ]
          }
        }
      },
      "Csrf": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "csrfToken"
        ],
        "properties": {
          "csrfToken": {
            "type": "string",
            "minLength": 32
          }
        }
      },
      "SchemaDocument": {
        "type": "object"
      },
      "VersionHeader": {
        "type": "string",
        "pattern": "^\"[1-9][0-9]{0,17}\"$(?![\\s\\S])",
        "maxLength": 20
      },
      "IdempotencyKey": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9._:-]+$(?![\\s\\S])"
      },
      "TrialFlow": {
        "type": "object",
        "required": [
          "flow_token",
          "expires_at"
        ],
        "additionalProperties": false,
        "properties": {
          "flow_token": {
            "type": "string",
            "minLength": 40,
            "maxLength": 100
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "TrialReceipt": {
        "type": "object",
        "required": [
          "challenge_id",
          "state",
          "expires_at",
          "resend_at",
          "delivery"
        ],
        "additionalProperties": false,
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "active",
              "consumed",
              "expired",
              "exhausted",
              "replaced",
              "cancelled",
              "revoked"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "resend_at": {
            "type": "string",
            "format": "date-time"
          },
          "delivery": {
            "type": "string",
            "enum": [
              "pending",
              "test",
              "failed",
              "unknown"
            ]
          },
          "notification": {
            "type": "object",
            "required": [
              "code",
              "mode"
            ],
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "pattern": "^[0-9]{6}$"
              },
              "mode": {
                "const": "test-notification"
              }
            }
          }
        }
      },
      "TrialAccount": {
        "type": "object",
        "required": [
          "id",
          "mobile",
          "role"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "mobile": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{6,14}$"
          },
          "role": {
            "enum": [
              "user",
              "owner",
              "expert",
              "admin"
            ]
          }
        }
      },
      "TrialMe": {
        "oneOf": [
          {
            "type": "object",
            "required": [
              "authenticated"
            ],
            "additionalProperties": false,
            "properties": {
              "authenticated": {
                "const": false
              }
            }
          },
          {
            "type": "object",
            "required": [
              "authenticated",
              "user",
              "assurance"
            ],
            "additionalProperties": false,
            "properties": {
              "authenticated": {
                "const": true
              },
              "user": {
                "$ref": "#/components/schemas/TrialAccount"
              },
              "assurance": {
                "enum": [
                  "test",
                  "real"
                ]
              }
            }
          }
        ]
      },
      "TrialVerify": {
        "type": "object",
        "required": [
          "authenticated"
        ],
        "additionalProperties": false,
        "properties": {
          "authenticated": {
            "const": true
          },
          "recovered": {
            "const": true
          }
        }
      },
      "TrialError": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Error"
